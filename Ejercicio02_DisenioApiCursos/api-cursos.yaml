openapi: 3.0.3
info:
  title: API de Cursos Universitarios
  description: API para administrar los cursos de una universidad.
  version: 1.0.0
servers:
  - url: http://localhost:8080

tags:
  - name: Cursos

paths:
  /api/cursos:
    get:
      tags: [Cursos]
      summary: Consultar cursos
      description: Retorna la lista completa de cursos registrados.
      operationId: consultarCursos
      responses:
        "200":
          description: Lista de cursos obtenida correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Curso"
    post:
      tags: [Cursos]
      summary: Crear curso
      description: Registra un nuevo curso universitario.
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoRequest"
      responses:
        "201":
          description: Curso creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "400":
          description: Datos del curso invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cursos/{id}:
    put:
      tags: [Cursos]
      summary: Actualizar curso
      description: Actualiza los datos de un curso existente.
      operationId: actualizarCurso
      parameters:
        - $ref: "#/components/parameters/CursoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursoRequest"
      responses:
        "200":
          description: Curso actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "400":
          description: Datos del curso invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un curso con el id indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Cursos]
      summary: Eliminar curso
      description: Elimina un curso del listado.
      operationId: eliminarCurso
      parameters:
        - $ref: "#/components/parameters/CursoId"
      responses:
        "204":
          description: Curso eliminado correctamente.
        "404":
          description: No existe un curso con el id indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/cursos/codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar curso por codigo
      description: Busca un curso por su codigo exacto.
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          description: Codigo del curso a buscar.
          schema:
            type: string
      responses:
        "200":
          description: Curso encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Curso"
        "404":
          description: No existe un curso con el codigo indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    CursoId:
      name: id
      in: path
      required: true
      description: Identificador del curso.
      schema:
        type: integer
        format: int64

  schemas:
    EstadoCurso:
      type: string
      description: Estado actual del curso.
      enum:
        - ACTIVO
        - INACTIVO
        - CANCELADO

    CursoRequest:
      type: object
      required:
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        nombre:
          type: string
          example: Estructuras de Datos
        codigo:
          type: string
          example: CC-201
        creditos:
          type: integer
          example: 4
        estado:
          $ref: "#/components/schemas/EstadoCurso"

    Curso:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: "#/components/schemas/CursoRequest"

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: No existe un curso con el id indicado.
        codigo:
          type: integer
          example: 404
